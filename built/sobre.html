<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sobre você · Built</title>
<meta name="robots" content="noindex">
<meta name="description" content="Formulário para membros da Built contarem quem são e o que querem.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://built-bot.built-bot.workers.dev; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect x='1' y='14' width='5' height='7' fill='%231F1E1C'/%3E%3Crect x='8.5' y='8' width='5' height='13' fill='%231F1E1C'/%3E%3Crect x='16' y='2' width='5' height='19' fill='%23A65A43'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:#F7F5F0;color:#1F1E1C;font:400 16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:#1F1E1C;text-underline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.topo{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
.topo b{font:400 30px/1 'Instrument Serif',serif;letter-spacing:-.02em}
.topo span{font:400 14px/1 Inter,sans-serif;color:#6E6A63}
.barra{display:flex;align-items:center;gap:10px}
.barra button{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#3D3B37}
.barra button:hover{background:#EDE8DF}
.barra svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.prog{flex:1;height:4px;border-radius:4px;background:#E7E3DB;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#A65A43;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.cont{font:500 13px/1 Inter,sans-serif;color:#6E6A63;min-width:34px;text-align:right}
h1{margin:22px 0 0;font:400 clamp(34px,7vw,46px)/1.02 'Instrument Serif',serif;letter-spacing:-.015em;text-wrap:balance}
.sub{margin:10px 0 0;color:#6E6A63;font-size:15px}
.campo{margin-top:26px}
.campo>label,.campo>.rot{display:block;font:500 15px/1.35 Inter,sans-serif;color:#1F1E1C}
.campo .dica{display:block;margin-top:3px;font:400 13px/1.4 Inter,sans-serif;color:#6E6A63}
input[type=text],textarea{margin-top:10px;width:100%;padding:14px 16px;border-radius:14px;border:1px solid #D6D0C5;background:#FCFBF8;font:400 16px/1.4 Inter,sans-serif;color:#1F1E1C}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #1F1E1C;outline-offset:1px;border-color:#1F1E1C}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid #D6D0C5;background:#FCFBF8;color:#1F1E1C;border-radius:999px;padding:10px 15px;font:500 15px/1.2 Inter,sans-serif;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:#1F1E1C}
.chip[aria-pressed="true"]{background:#1F1E1C;border-color:#1F1E1C;color:#FCFBF8}
.chip:focus-visible{outline:2px solid #A65A43;outline-offset:2px}
.links{margin-top:12px;display:grid;gap:10px}
.links label{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font:500 14px/1.2 Inter,sans-serif;color:#3D3B37}
.links input{margin:0}
.acoes{margin-top:32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{appearance:none;border:0;height:56px;padding:0 28px;border-radius:999px;background:#1F1E1C;color:#FCFBF8;font:500 16px/1 Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:12px}
.btn:hover{background:#000}
.btn[disabled]{opacity:.6;cursor:wait}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pular{appearance:none;border:0;background:none;padding:0;font:400 14px/1 Inter,sans-serif;color:#6E6A63;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.erro{margin:14px 0 0;min-height:20px;font:500 14px/1.4 Inter,sans-serif;color:#A0402A}
.passo{animation:entra .35s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.passo{animation:none}}
.aviso{margin-top:40px;padding:22px;border-radius:18px;background:#FCFBF8;border:1px solid #E7E3DB}
.aviso h1{margin-top:0}
.rodape{margin-top:36px;font:400 12px/1.5 Inter,sans-serif;color:#6E6A63}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><b>Built</b><span>sobre você</span></div>
  <div id="form" hidden>
    <div class="barra"><button type="button" id="voltar" aria-label="Voltar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button><div class="prog" aria-hidden="true"><i id="prog"></i></div><span class="cont" id="cont"></span></div>
    <div id="corpo"></div>
  </div>
  <div id="sem-link" class="aviso" hidden>
    <h1>Esse link vem do bot.</h1>
    <p class="sub">Esse formulário é pra quem está na Built. Abre o bot no Telegram e manda <b>/forms</b> que ele te devolve o seu link pessoal.</p>
    <p style="margin-top:18px"><a href="https://t.me/built_condz_bot">Abrir o bot</a></p>
  </div>
  <p class="rodape">Suas respostas ficam com o Condz e ajudam ele (e o bot) a te ajudar melhor. <a href="privacidade.html">Privacidade</a></p>
</div>
<script>
(() => {
  const API = 'https://built-bot.built-bot.workers.dev/sobre';
  const O = {
    querGrupo: [['networking', 'Networking e gente no mesmo caminho'], ['conteudo', 'Aprender a criar conteúdo'], ['vender', 'Vender mais'], ['constancia', 'Constância (alguém cobrando)'], ['ia', 'IA e automação'], ['cabeca', 'Mentalidade e cabeça'], ['feedback', 'Feedback do Condz'], ['amigos', 'Fazer amigos']],
  };
  const PASSOS = [
    { t: 'Me conta sobre você.', s: 'Do jeito que você contaria numa mesa de bar.', c: [
      { k: 'sobre', tipo: 'area', l: 'Quem é você?', ph: 'de onde você é, o que faz hoje, família, o que gosta de fazer, como chegou aqui', obrig: true },
      { k: 'idade', tipo: 'texto', l: 'Idade', ph: 'ex.: 29', max: 20 },
      { k: 'cidade', tipo: 'texto', l: 'Cidade', ph: 'ex.: Curitiba', max: 60 },
    ] },
    { t: 'O que você quer da Built.', s: 'Pra eu saber onde focar com você.', c: [
      { k: 'querGrupo', tipo: 'varios', l: 'O que você mais quer tirar do grupo?', d: 'Pode marcar mais de um.' },
      { k: 'quer', tipo: 'area', l: 'Nas suas palavras', ph: 'o que faria a Built valer muito a pena pra você?' },
      { k: 'precisa', tipo: 'area', l: 'O que você mais precisa hoje?', ph: 'pode ser no negócio, no conteúdo, na cabeça, no tempo...' },
    ] },
    { t: 'Seus objetivos.', s: 'Sem filtro. Ninguém vê além do Condz.', c: [
      { k: 'obj1', tipo: 'area', l: 'Daqui a 1 ano, o que você quer ter conquistado?' },
      { k: 'obj5', tipo: 'area', l: 'E daqui a 5 anos?' },
      { k: 'obj10', tipo: 'area', l: 'E daqui a 10 anos?' },
    ] },
    { t: 'E você na galera.', s: 'A Built é troca. Todo mundo sabe alguma coisa que ajuda o outro.', c: [
      { k: 'oferece', tipo: 'area', l: 'No que você pode ajudar a galera?', ph: 'ex.: tráfego pago, design, vendas por WhatsApp, programação' },
      { k: 'mais', tipo: 'area', l: 'Algo mais que eu deveria saber sobre você?', d: 'Opcional.' },
    ] },
  ];
  const LINKS = [];

  const $ = (s) => document.querySelector(s);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const m = new URLSearchParams(location.search).get('m') || '';
  if (!/^\d{1,15}\.[0-9a-f]{16}$/.test(m)) { $('#sem-link').hidden = false; return; }
  const KEY = 'built_sobre_' + m.split('.')[0];
  let r = {};
  try { r = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} };
  let passo = 0, nome = '', enviando = false;

  function render() {
    const P = PASSOS[passo];
    $('#prog').style.width = (passo / PASSOS.length) * 100 + '%';
    $('#cont').textContent = `${passo + 1}/${PASSOS.length}`;
    $('#voltar').style.visibility = passo ? 'visible' : 'hidden';
    const titulo = passo === 0 && nome ? `${esc(nome)}, me conta sobre você.` : esc(P.t);
    const campos = P.c.map((c) => {
      const dica = c.d ? `<span class="dica">${esc(c.d)}</span>` : '';
      if (c.tipo === 'texto') return `<div class="campo"><label for="f-${c.k}">${esc(c.l)}${dica}</label><input type="text" id="f-${c.k}" data-k="${c.k}" maxlength="${c.max || 160}" placeholder="${esc(c.ph || '')}" value="${esc(r[c.k] || '')}"></div>`;
      if (c.tipo === 'area') return `<div class="campo"><label for="f-${c.k}">${esc(c.l)}${dica}</label><textarea id="f-${c.k}" data-k="${c.k}" maxlength="${c.k === 'sobre' ? 800 : 400}" placeholder="${esc(c.ph || '')}">${esc(r[c.k] || '')}</textarea></div>`;
      if (c.tipo === 'links') return `<div class="campo"><div class="links">${LINKS.map(([k, l]) => `<label>${esc(l)}<input type="text" data-link="${k}" maxlength="200" autocapitalize="off" spellcheck="false" placeholder="${k === 'x' || k === 'instagram' || k === 'tiktok' ? '@seuuser ou link' : 'https://'}" value="${esc((r.links || {})[k] || '')}"></label>`).join('')}</div></div>`;
      const multi = c.tipo === 'varios';
      const sel = (v) => (multi ? (r[c.k] || []).includes(v) : r[c.k] === v);
      return `<div class="campo" role="group" aria-label="${esc(c.l)}"><span class="rot">${esc(c.l)}${dica}</span><div class="chips">${O[c.k].map(([v, l]) => `<button type="button" class="chip" data-k="${c.k}" data-v="${v}" data-multi="${multi ? 1 : 0}" aria-pressed="${sel(v)}">${esc(l)}</button>`).join('')}</div></div>`;
    }).join('');
    const ultimo = passo === PASSOS.length - 1;
    $('#corpo').innerHTML = `<div class="passo"><h1>${titulo}</h1><p class="sub">${esc(P.s)}</p>${campos}<p class="erro" role="alert"></p><div class="acoes"><button type="button" class="btn" id="seguir">${ultimo ? 'Enviar' : 'Continuar'}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>${!ultimo && passo > 0 ? '<button type="button" class="pular" id="pular">pular esta parte</button>' : ''}</div></div>`;
    $('#corpo').querySelectorAll('[data-k]').forEach((el) => {
      if (el.classList.contains('chip')) {
        el.addEventListener('click', () => {
          const k = el.dataset.k, v = el.dataset.v;
          if (el.dataset.multi === '1') {
            const set = new Set(r[k] || []);
            if (set.has(v)) set.delete(v); else { if (v === 'nenhuma') set.clear(); else set.delete('nenhuma'); set.add(v); }
            r[k] = [...set];
            $('#corpo').querySelectorAll(`.chip[data-k="${k}"]`).forEach((b) => b.setAttribute('aria-pressed', String(set.has(b.dataset.v))));
          } else {
            r[k] = r[k] === v ? undefined : v;
            $('#corpo').querySelectorAll(`.chip[data-k="${k}"]`).forEach((b) => b.setAttribute('aria-pressed', String(r[k] === b.dataset.v)));
          }
          salvar();
        });
      } else el.addEventListener('input', () => { r[el.dataset.k] = el.value; salvar(); });
    });
    $('#corpo').querySelectorAll('[data-link]').forEach((el) => el.addEventListener('input', () => { r.links = { ...(r.links || {}), [el.dataset.link]: el.value.trim() }; salvar(); }));
    $('#seguir').addEventListener('click', seguir);
    const pul = $('#pular');
    if (pul) pul.addEventListener('click', () => { passo++; render(); window.scrollTo(0, 0); });
    const f = $('#corpo').querySelector('input,textarea');
    if (f && passo === 0) f.focus({ preventScroll: true });
  }

  function seguir() {
    const err = $('#corpo .erro');
    if (passo === 0 && !String(r.sobre || '').trim()) { err.textContent = 'Conta um pouco sobre você pra eu te conhecer.'; $('#f-sobre').focus(); return; }
    if (passo < PASSOS.length - 1) { passo++; render(); window.scrollTo(0, 0); return; }
    if (enviando) return;
    enviando = true;
    const btn = $('#seguir');
    btn.disabled = true; btn.firstChild.textContent = 'Enviando…';
    fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ m, respostas: r }) })
      .then((x) => x.json().then((d) => ({ x, d })))
      .then(({ x, d }) => {
        if (!x.ok || !d.ok) throw new Error(d.error || 'erro');
        $('#form').hidden = true;
        const fim = document.createElement('div');
        fim.className = 'aviso passo';
        fim.innerHTML = `<h1>${d.atualizou ? 'Atualizado.' : 'Valeu por contar.'}</h1><p class="sub">Vou ler com calma. Se quiser mudar alguma coisa, é só abrir este link de novo.</p><p style="margin-top:18px"><a href="https://t.me/built_condz_bot">Voltar pro Telegram</a></p>`;
        $('.wrap').insertBefore(fim, $('.rodape'));
      })
      .catch((e) => { err.textContent = /link|faltou/.test(e.message) ? e.message : 'Não deu certo agora. Tenta de novo em instantes.'; })
      .finally(() => { enviando = false; btn.disabled = false; btn.firstChild.textContent = 'Enviar'; });
  }

  $('#voltar').addEventListener('click', () => { if (passo > 0) { passo--; render(); window.scrollTo(0, 0); } });
  fetch(`${API}?m=${encodeURIComponent(m)}`)
    .then((x) => x.json())
    .then((d) => {
      if (!d.ok) { $('#sem-link').hidden = false; return; }
      nome = (d.nome || '').split(' ')[0];
      if (d.respostas && !Object.keys(r).length) { r = d.respostas; salvar(); }
      $('#form').hidden = false;
      render();
    })
    .catch(() => { $('#form').hidden = false; render(); });
})();
</script>
</body>
</html>
