<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp · Conrado de Sá</title>
<meta name="robots" content="noindex">
<noscript><meta http-equiv="refresh" content="0;url=https://wa.me/5511955075077?text=Decidi%20evoluir.%20Quero%20come%C3%A7ar%20oficialmente%20meus%207%20dias%20com%20os%20ensinamentos%20milenares."></noscript>
<script>
// Link curto que abre o WhatsApp do bot com a mensagem pronta.
//   ?p=  o que a pessoa quer: 7dias (padrão), desafio, mentoria, teste. Cada frase cai no fluxo certo do bot.
//   ?o=  de onde veio (story, dm, bio...). Vai no fim da mensagem como " · origem" (a bio não leva sufixo).
(function(){
  var q=new URLSearchParams(location.search);
  var o=(q.get('o')||'').replace(/[^a-z0-9]/gi,'').slice(0,12);
  var p=(q.get('p')||'').toLowerCase();
  var F={
    '7dias':'Decidi evoluir. Quero começar oficialmente meus 7 dias com os ensinamentos milenares.',
    'desafio':'Quero entrar no DESAFIO Evolução Mental de 21 dias.',
    'mentoria':'Quero saber da MENTORIA individual com o Conrado.',
    'teste':'Quero fazer o TESTE: onde eu mais preciso evoluir?'
  };
  var txt=(F[p]||F['7dias'])+(o&&o!=='bio'?' · '+o:'');
  var url='https://wa.me/5511955075077?text='+encodeURIComponent(txt);
  document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('ir');if(a)a.href=url;});
  // contador de visitas (bot whats-evolucao, src/visitas.js): sem cookie, sem IP; u=1 só na 1ª vez do dia neste navegador
  try{var d=new Date(Date.now()-108e5).toISOString().slice(0,10),u='0';try{if(localStorage.getItem('cz_v_w')!==d){localStorage.setItem('cz_v_w',d);u='1';}}catch(e){}
    var vo=(o||'bio').toLowerCase()+(F[p]&&p!=='7dias'?'-'+p:'');
    if(navigator.sendBeacon)navigator.sendBeacon('https://whats-evolucao.built-bot.workers.dev/v?p=w&o='+vo+'&u='+u);}catch(e){}
  location.replace(url);
})();
</script>

</head>

</body>
</html>
